version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/bench"]
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /bench/js
    schedule:
      interval: monthly
